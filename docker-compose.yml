services:

  app-blue:
    build: .
    container_name: app-blue
    environment:
      - PORT=3000
      - VERSION=BLUE
    expose:
      - "3000"

  app-green:
    build: .
    container_name: app-green
    environment:
      - PORT=3000
      - VERSION=GREEN
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: demo-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-blue
      - app-green